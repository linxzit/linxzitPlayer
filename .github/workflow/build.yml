# Linxzit Player - Real Android Project

## How to run
1. Install Android Studio (free) from developer.android.com/studio
2. File > Open > select this LinxzitPlayerAndroid folder > Wait for Gradle Sync
3. On phone: Settings > About Phone > Tap Build Number 7 times > Turn ON USB Debugging
4. Connect phone with USB > Allow debugging
5. Click green Run button > Choose your phone
6. App installs as Linxzit Player

## How to use
- Tap Scan Phone For All Music & Videos - finds everything on phone
- OR Tap Add Music / Add Videos - pick files
- Tap any file to play. Next/Prev, play/pause, speed & fullscreen in video controls.
- Starts empty. No sample songs. Your files only.
